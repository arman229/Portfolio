 <svg
            xmlns="http://www.w3.org/2000/svg"
            width="36"
            height="36"
            viewBox="0 0 24 24"
            fill="black"
          >
            <rect x="4" y="5" width="16" height="14" rx="2" fill="black" />

            <circle cx="8" cy="11" r="1" fill="white">
              <animate
                attributeName="r"
                values="1;1.5;1"
                dur="1s"
                repeatCount="indefinite"
              />
            </circle>
            <circle cx="16" cy="11" r="1" fill="white">
              <animate
                attributeName="r"
                values="1;1.5;1"
                dur="1s"
                begin="0.5s"
                repeatCount="indefinite"
              />
            </circle>

            <rect x="8" y="15" width="1.5" height="2" fill="white">
              <animate
                attributeName="opacity"
                values="1;0.1;1"
                dur="1s"
                repeatCount="indefinite"
              />
            </rect>
            <rect x="11" y="15" width="1.5" height="2" fill="white">
              <animate
                attributeName="opacity"
                values="1;0.1;1"
                dur="1s"
                begin="0.3s"
                repeatCount="indefinite"
              />
            </rect>
            <rect x="14" y="15" width="1.5" height="2" fill="white">
              <animate
                attributeName="opacity"
                values="1;0.1;1"
                dur="1s"
                begin="0.6s"
                repeatCount="indefinite"
              />
            </rect>

            <rect x="11.5" y="2" width="1" height="3" fill="black" />
            <circle cx="12" cy="1.5" r="1" fill="black">
              <animate
                attributeName="opacity"
                values="1;0.3;1"
                dur="1s"
                repeatCount="indefinite"
              />
            </circle>

            <rect x="2" y="9" width="2" height="6" fill="black" />
            <rect x="20" y="9" width="2" height="6" fill="black" />
          </svg>